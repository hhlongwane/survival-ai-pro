services:
  - type: web
    name: survival-ai-pro
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: survival-ai-pro-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: survival-ai-pro-db
    plan: free
